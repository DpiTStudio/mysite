{% if faqs %}
<div class="mb-5 faq-section">
    <div class="d-flex align-items-center mb-4">
        <div class="icon-square text-bg-info d-inline-flex align-items-center justify-content-center fs-4 flex-shrink-0 me-3 rounded-4 shadow-sm" style="width: 50px; height: 50px;">
            <i class="fas fa-question text-white"></i>
        </div>
        <h3 class="fw-bold mb-0 service-heading">Частые вопросы</h3>
    </div>
    
    <div class="accordion faq-accordion" id="faqAccordion">
        {% for faq in faqs %}
        <div class="accordion-item border-0 mb-3 shadow-sm rounded-4 overflow-hidden bg-body">
            <h2 class="accordion-header" id="heading{{ forloop.counter }}">
                <button class="accordion-button collapsed fw-semibold py-3 px-4 shadow-none bg-body-tertiary" 
                        type="button" 
                        data-bs-toggle="collapse" 
                        data-bs-target="#collapse{{ forloop.counter }}" 
                        aria-expanded="false" 
                        aria-controls="collapse{{ forloop.counter }}"
                        style="font-size: 1.05rem;">
                    {{ faq.question }}
                </button>
            </h2>
            <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse" aria-labelledby="heading{{ forloop.counter }}" data-bs-parent="#faqAccordion">
                <div class="accordion-body px-4 pb-4 pt-3 text-body-secondary lh-lg" style="font-size: 1rem;">
                    {{ faq.answer|linebreaks }}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
