{% if faqs %}
<div class="mb-5">
    <h4 class="fw-bold mb-4 service-heading"><i class="fas fa-question-circle text-info me-2"></i>Частые вопросы</h4>
    <div class="accordion accordion-flush faq-accordion" id="faqAccordion">
        {% for faq in faqs %}
        <div class="accordion-item bg-transparent border-bottom border-secondary border-opacity-30">
            <h2 class="accordion-header" id="heading{{ forloop.counter }}">
                <button class="accordion-button collapsed bg-transparent service-heading fw-semibold shadow-none py-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.counter }}">
                    {{ faq.question }}
                </button>
            </h2>
            <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                <div class="accordion-body text-subtle pb-4 pt-0 leading-relaxed">
                    {{ faq.answer }}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
