<div class="d-flex align-items-center mb-4">
    {% if service.icon %}
        <img src="{{ service.icon.url }}" alt="{{ service.title }}" class="me-4 rounded-3 p-2 bg-white bg-opacity-10 border border-white border-opacity-10" style="width: 64px; height: 64px; object-fit: contain;">
    {% endif %}
    <div>
        <h1 class="display-5 fw-bold mb-1 text-white">{{ service.title }}</h1>
        {% if service.category %}
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-1 rounded-pill small">
                {{ service.category.name }}
            </span>
        {% endif %}
        {% if service.is_popular %}
            <span class="badge bg-warning bg-opacity-25 text-warning border border-warning border-opacity-25 px-3 py-1 rounded-pill small ms-2">
                <i class="fas fa-fire me-1"></i> Хит продаж
            </span>
        {% endif %}
    </div>
</div>

<div class="mb-5">
    <h4 class="fw-bold mb-3 text-white">Описание услуги</h4>
    <div class="content-body text-muted leading-relaxed">
        {{ service.description|safe }}
    </div>
</div>
