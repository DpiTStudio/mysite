{% if steps %}
<div class="mb-5">
    <h4 class="fw-bold mb-4 service-heading"><i class="fas fa-tasks text-success me-2"></i>Как мы работаем</h4>
    <div class="process-timeline px-2">
        {% for step in steps %}
        <div class="process-step mb-4 d-flex align-items-start p-3.5 rounded-4 service-info-card shadow-sm">
            <div class="step-num me-3 d-flex align-items-center justify-content-center bg-primary text-white rounded-circle fw-bold fs-5 shadow-sm" style="min-width: 44px; height: 44px;">
                {{ step.step_number }}
            </div>
            <div>
                <h5 class="fw-bold service-heading mb-1.5 fs-6">{{ step.title }}</h5>
                <p class="text-subtle small mb-0 leading-relaxed">{{ step.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
