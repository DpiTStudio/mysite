{% if tech_list %}
<div class="mb-5">
    <h4 class="fw-bold mb-4 service-heading">
        <i class="fas fa-layer-group text-info me-2"></i>Используемый стек / Технологии
    </h4>
    <div class="tech-stack-container p-4 rounded-4 service-info-card">
        <div class="d-flex flex-wrap gap-2">
            {% for tech in tech_list %}
            <div class="tech-pill d-inline-flex align-items-center px-3 py-2">
                <i class="fas fa-code-branch me-2 fs-6 opacity-75"></i>
                <span class="fw-semibold" style="letter-spacing: 0.3px; font-size: 0.95rem;">{{ tech }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
