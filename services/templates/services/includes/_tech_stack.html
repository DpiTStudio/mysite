{% if tech_list %}
<div class="mb-8" style="margin-top: 6rem;">
    <h4 class="fw-bold mb-4 service-heading d-flex align-items-center">
        <span class="bg-info bg-opacity-10 text-info p-2 rounded-3 me-3 d-inline-flex justify-content-center align-items-center shadow-sm">
            <i class="fas fa-layer-group"></i>
        </span>
        Используемый стек / Технологии
    </h4>
    <div class="tech-stack-container p-4 rounded-4 service-info-card">
        <div class="d-flex flex-wrap gap-2">
            {% for tech in tech_list %}
            <div class="tech-pill d-inline-flex align-items-center px-3 py-2 bg-white rounded-pill shadow-sm border">
                <i class="fas fa-code-branch text-info me-2 opacity-75"></i>
                <span class="fw-medium text-dark">{{ tech }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
